name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test shortcut installation and removal
        shell: ${{ matrix.shell }}
        run: ./tests/install.Tests.ps1
